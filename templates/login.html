{% extends 'base.html' %}

{% block stylesheets %}
<link rel="stylesheet" href="/static/css/base.css">
{% endblock %}

{% block content %}
<div class="form-container first">
    <form id="login-form">
        <h1>Login</h1>
        <label for="email">Email</label>
        <input class="field" type="email" id="email" placeholder="youremail@domain.com" required>

        <label for="password">Password</label>
        <input class="field" type="password" id="password" required>

        <div class="error"></div>
        <div class="info"></div>
        <button type="submit" id="login-btn">Login</button>
    </form>
</div>

<div class="last">
    <p>Not registered yet? <a href="/pages/signup">Sign Up</a></p>
</div>
<script type="module" src="/static/js/login.js"></script>
{% endblock %}
